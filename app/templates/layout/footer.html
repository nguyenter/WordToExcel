<footer class="app-footer border-top w-100 mt-3">
    <div class="container py-3">
        <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
            <div class="text-center text-md-start small fw-semibold text-secondary">
                Phiên bản hiện tại: v26.02.03
            </div>

            <div class="text-center text-md-end small footer-copyright">
                © <span id="currentYear"></span> Design by PhNguyn
            </div>
        </div>
    </div>
    <div class="qr-modal-overlay" id="qrModalOverlay" aria-hidden="true">
        <div class="qr-modal-card" role="dialog" aria-modal="true" aria-label="Mã QR liên hệ">
            <button type="button" class="qr-close-btn" id="closeQrModal" aria-label="Đóng mã QR">×</button>
            <img src="{{ url_for('static', filename='images/qr.png') }}" alt="Mã QR liên hệ" class="qr-modal-image">
        </div>
    </div>
    <script>document.getElementById('currentYear').innerText = new Date().getFullYear();</script>
    <script>
        (function () {
            const openBtn = document.getElementById('openQrModal');
            const closeBtn = document.getElementById('closeQrModal');
            const modal = document.getElementById('qrModalOverlay');

            if (!openBtn || !closeBtn || !modal) return;

            openBtn.addEventListener('click', function () {
                modal.classList.add('show');
                modal.setAttribute('aria-hidden', 'false');
            });

            closeBtn.addEventListener('click', function () {
                modal.classList.remove('show');
                modal.setAttribute('aria-hidden', 'true');
            });
        })();
    </script>
</footer>
